# Prefix is Ctrl-a (Ctrl-o also works); Ctrl-a Ctrl-a sends a literal Ctrl-a
unbind C-b
set -g prefix C-a
set-option -g prefix2 C-o
bind C-a send-prefix

# Splits without the prefix
bind -n C-b split-window -h
bind -n C-n split-window -v
bind -n C-q splitw -v -p 25

# Move between panes with Ctrl + vim keys, no prefix
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-j select-pane -D
bind -n C-k select-pane -U

# Resize panes with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind-key s set-window-option synchronize-panes
bind r source-file ~/.tmux.conf \; display "Reloaded!"

set -g mouse on
set -g history-limit 30000
set -g focus-events on
set -s escape-time 20
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc,xterm-256color:Tc"
set-window-option -g alternate-screen on

# Copy mode: vi keys, copy to the macOS clipboard
setw -g mode-keys vi
set -s set-clipboard off
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Status bar
set -g status-interval 15
set -g status-bg colour244
set -g status-left-length 25
set -g status-left "#[fg=colour250]#[bg=colour8]  [#S]  "
set -g status-right-length 80
set -g status-right "#[fg=colour250]#[bg=colour8]  #(whoami)@#h | %H:%M | %a %d %b %Y  "
set-window-option -g window-status-format " [#I:#W] "
set-window-option -g window-status-current-format " [#I:#W] "

# Plugins (prefix + I to install)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'

# Keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
